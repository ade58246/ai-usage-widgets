[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-widgets"
version = "0.1.0"
description = "Always-on-top Windows widgets for Codex and Claude rate limits"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codex Usage Widget contributors" }]
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "PyInstaller>=6.10,<7",
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[project.gui-scripts]
codex-usage-widget = "codex_usage_widget.app:main"
claude-usage-widget = "claude_usage_widget.app:main"
battery-usage-widget = "battery_usage_widget.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
